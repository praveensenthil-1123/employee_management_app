name: Employee Management CI/CD Pipeline

on:
  push:
    branches:
      - main 

jobs:
  build:


    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4      

      - name: setup java
        uses: actions/setup-java@v4
        with:
           java-version: '25'
           distribution: 'temurin'

      - name: make maven executable
        run: chmod +x mvnw

      - name: Build with Maven
        run: ./mvnw clean package -DskipTests   

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: employee-management-app  
          path: target/*.jar

      - name: copy artifact to server
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_BACKEND_USER }}
          password: ${{ secrets.EC2_BACKEND_KEY }}
          source: "target/*.jar"
          target: "/opt/employee-app/releases"

      - name: Verify deployment
        uses: appleboy/ssh-action@v1
        with: 
          host: ${{ secrets.EC2_BACKEND_HOST }}
          username: ${{ secrets.EC2_BACKEND_USER }}
          password: ${{ secrets.EC2_BACKEND_KEY }}
          script: |
            echo "Deployment successful. Verifying the application..."
            ls -lh /opt/employee-app/releases
            